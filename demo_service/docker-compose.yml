services:
  db:
    image: postgres:16-alpine
    container_name: resolve-demo-db

    environment:
      POSTGRES_DB: resolve_demo
      POSTGRES_USER: resolve_user
      POSTGRES_PASSWORD: resolve_password

    ports:
      - "5433:5432"

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U resolve_user -d resolve_demo"
        ]
      interval: 3s
      timeout: 3s
      retries: 10

  api:
    build:
      context: ./api

    container_name: resolve-demo-api

    environment:
      DB_HOST: db
      DB_PORT: "5432"
      DB_NAME: resolve_demo
      DB_USER: resolve_user
      DB_PASSWORD: resolve_password

    ports:
      - "8080:8080"

    depends_on:
      db:
        condition: service_healthy
